<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajero Auto-Download</title>
    <style>
        :root { --primary: #3b82f6; --bg: #f8fafc; --text: #1e293b; --success: #10b981; --error: #ef4444; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); color: var(--text); padding: 15px; 
            display: flex; justify-content: center; min-height: 100vh; margin: 0;
        }
        
        .card { 
            background: white; width: 100%; max-width: 550px; padding: 1.5rem; 
            border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            height: fit-content; display: flex; flex-direction: column;
        }
        
        h1 { text-align: center; color: #0f172a; margin: 0 0 1.5rem 0; font-size: 1.5rem; }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 20px; flex-direction: column; }
        input { padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; font-size: 16px; }
        input:focus { border-color: var(--primary); }
        
        button { 
            padding: 14px; background: var(--primary); color: white; border: none; 
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* SECCIONES */
        #resultados, #panelProgreso, #mensajeExito, #reporteErrores { display: none; margin-top: 20px; }

        .thumb-img { width: 100%; height: auto; border-radius: 10px; margin-bottom: 15px; background: #eee; aspect-ratio: 16/9; object-fit: cover; }
        
        .format-btn { 
            display: flex; justify-content: space-between; padding: 15px; 
            border: 1px solid #e2e8f0; margin-bottom: 10px; border-radius: 8px; 
            cursor: pointer; background: white; align-items: center;
        }
        .format-btn:active { background: #eff6ff; border-color: var(--primary); }

        #panelProgreso { background: #f1f5f9; padding: 20px; border-radius: 12px; text-align: center; }
        .progress-track { width: 100%; height: 12px; background: #cbd5e1; border-radius: 6px; overflow: hidden; margin: 15px 0; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }
        .stats { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: bold; color: #64748b; }

        #mensajeExito { text-align: center; animation: popIn 0.3s; }
        
        /* Botón discreto por si falla la auto-descarga */
        .btn-manual-download {
            background: transparent; color: var(--primary); 
            border: 2px solid var(--primary); margin-bottom: 15px;
        }
        
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="card">
        <h1>📲 Viajero Automático</h1>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Pega el link aquí..." onkeypress="if(event.key==='Enter') analizar()">
            <button onclick="analizar()" id="btnAnalizar">🔍 Buscar</button>
        </div>

        <div id="resultados">
            <img id="thumbImg" class="thumb-img" src="">
            <h3 id="tituloVid" style="margin: 0 0 15px 0; font-size: 1.1rem; line-height: 1.4;"></h3>
            <div id="listaFormatos"></div>
        </div>

        <div id="panelProgreso">
            <div id="lblContador" style="font-weight:bold; color:#64748b;">Iniciando...</div>
            <div id="lblTituloActual" style="font-weight:bold; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">...</div>
            
            <div class="progress-track"><div class="progress-fill" id="barra"></div></div>
            
            <div class="stats">
                <span id="lblAvance">-- MB</span>
                <span id="lblPorcentaje">0%</span>
                <span id="lblVelocidad">-- MB/s</span>
            </div>
        </div>

        <div id="mensajeExito">
            <div style="font-size: 3rem;">🚀</div>
            <h3>¡Enviando archivo... checkea tus descargas!</h3>
            <p style="color:#64748b; font-size:0.9rem;">Si la descarga no inició automáticamente, toca aquí:</p>
            
            <a id="linkDescargaFinal" class="btn-manual-download" href="#" style="display:block; padding:10px; text-decoration:none; border-radius:8px; font-weight:bold;">
                📥 Forzar Descarga
            </a>
            
            <button style="width:100%; background: #64748b;" onclick="resetUI()">🔄 Descargar otro</button>
        </div>

        <div id="reporteErrores">
            <h3 style="color: var(--error);">⚠️ Errores:</h3>
            <div id="listaErrores"></div>
            <button style="background: var(--error); width:100%; margin-top:10px;" onclick="resetUI()">Cerrar</button>
        </div>
    </div>

    <script>
        let urlActual = "", esPlaylist = false;

        async function analizar() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            resetUI();
            const btn = document.getElementById('btnAnalizar');
            btn.disabled = true; btn.innerText = "⏳...";

            try {
                const fd = new FormData(); fd.append('url', url);
                const res = await fetch('/analizar', { method: 'POST', body: fd });
                const data = await res.json();
                
                if(data.error) throw new Error(data.error);

                urlActual = url; esPlaylist = data.es_playlist;
                document.getElementById('tituloVid').innerText = data.titulo;
                if(data.miniatura) document.getElementById('thumbImg').src = data.miniatura;
                
                const lista = document.getElementById('listaFormatos'); lista.innerHTML = '';
                data.formatos.forEach(f => {
                    const div = document.createElement('div');
                    div.className = 'format-btn';
                    div.innerHTML = `<span>${f.texto}</span> <small><b>${f.ext.toUpperCase()}</b></small>`;
                    div.onclick = () => iniciarDescarga(f.id); 
                    lista.appendChild(div);
                });
                document.getElementById('resultados').style.display = 'block';

            } catch (e) { alert("Error: " + e.message); } 
            finally { btn.disabled = false; btn.innerText = "🔍 Buscar"; }
        }

        function iniciarDescarga(fid) {
            document.getElementById('resultados').style.display = 'none';
            document.getElementById('panelProgreso').style.display = 'block';

            const lblContador = document.getElementById('lblContador');
            const lblTitulo = document.getElementById('lblTituloActual');
            const barra = document.getElementById('barra');
            const lblAvance = document.getElementById('lblAvance');
            const lblPorc = document.getElementById('lblPorcentaje');
            const lblVel = document.getElementById('lblVelocidad');

            const params = new URLSearchParams({ url: urlActual, format_id: fid, es_playlist: esPlaylist });
            const evt = new EventSource(`/descargar_stream?${params}`);

            evt.onmessage = (e) => {
                const d = JSON.parse(e.data);

                if (d.status === 'nuevo_video') {
                    lblContador.innerText = `Procesando ${d.indice}/${d.total}`;
                    lblTitulo.innerText = d.titulo;
                    barra.style.width = '0%';
                }
                else if (d.status === 'descargando') {
                    barra.style.width = d.progreso + '%';
                    lblPorc.innerText = Math.round(d.progreso) + '%';
                    lblAvance.innerText = d.texto_avance;
                    lblVel.innerText = d.texto_velocidad;
                }
                else if (d.status === 'fin_total') {
                    evt.close();
                    document.getElementById('panelProgreso').style.display = 'none';
                    
                    if (d.errores.length > 0) {
                        mostrarErrores(d.errores);
                    } else {
                        // AQUÍ ESTÁ LA AUTO-DESCARGA
                        if (d.archivo_descarga) {
                            const linkFinal = `/bajar_archivo?name=${encodeURIComponent(d.archivo_descarga)}`;
                            
                            // 1. Configurar botón de respaldo
                            const btnManual = document.getElementById('linkDescargaFinal');
                            btnManual.href = linkFinal;
                            
                            // 2. EJECUTAR AUTO-DESCARGA
                            // Esto le dice al navegador: "Ve a esta dirección AHORA"
                            // Al ser un archivo adjunto, el navegador abrirá el diálogo de guardar
                            window.location.href = linkFinal;
                        }
                        
                        document.getElementById('mensajeExito').style.display = 'block';
                    }
                }
                else if (d.error) {
                    alert(d.error); evt.close(); resetUI();
                }
            };
            evt.onerror = () => { evt.close(); };
        }

        function mostrarErrores(errores) {
            const lista = document.getElementById('listaErrores'); lista.innerHTML = '';
            errores.forEach(err => {
                const p = document.createElement('div');
                p.innerText = `${err.titulo}: ${err.causa}`;
                lista.appendChild(p);
            });
            document.getElementById('reporteErrores').style.display = 'block';
        }

        function resetUI() {
            document.getElementById('urlInput').value = "";
            document.getElementById('resultados').style.display = 'none';
            document.getElementById('panelProgreso').style.display = 'none';
            document.getElementById('mensajeExito').style.display = 'none';
            document.getElementById('reporteErrores').style.display = 'none';
            urlActual = "";
        }
    </script>
</body>
</html>
